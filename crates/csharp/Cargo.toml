[package]
name = "changepacks-csharp"
version = "0.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C# (.NET) project support for changepacks (NuGet)"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
changepacks-utils.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["fs"] }
quick-xml = "0.41"
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
rstest.workspace = true
changepacks-utils = { workspace = true, features = ["test-support"] }
changepacks-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
