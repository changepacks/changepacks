[package]
name = "changepacks-rust"
version = "0.2.25"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust project support for changepacks (Cargo)"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
changepacks-utils.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["fs"] }
async-trait.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
rstest.workspace = true
changepacks-utils = { workspace = true, features = ["test-support"] }
changepacks-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
