[package]
name = "changepacks-node"
version = "0.2.23"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Node.js project support for changepacks (npm, pnpm, yarn)"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
changepacks-utils.workspace = true
async-trait = "0.1"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
tokio = { version = "1.52", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["test-util", "macros"] }
rstest = "0.26"

[lints]
workspace = true
