[package]
name = "changepacks-utils"
version = "0.2.22"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared utilities for changepacks (path handling, version calculation, git operations)"
readme = "../../README.md"

[features]
test-support = []

[dependencies]
gix = { version = "0.85", default-features = false, features = ["index", "status", "parallel", "revision", "sha1"] }
anyhow = "1.0"
changepacks-core.workspace = true
tokio = { version = "1.52", features = ["fs"] }
futures = "0.3"
serde_json = { version = "1.0", features = ["preserve_order"] }
ignore = "0.4"
glob = "0.3"

[dev-dependencies]
rstest = "0.26"
tempfile = "3.27"
tokio = { version = "1.52", features = ["test-util", "macros"] }
changepacks-node = { path = "../node" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "utils_bench"
harness = false
