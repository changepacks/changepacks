[package]
name = "changepacks-utils"
version = "0.2.22"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared utilities for changepacks (path handling, version calculation, git operations)"
readme = "../../README.md"

[features]
test-support = []
# Opt-in TOML manifest helpers (`ensure_toml_table_like`). Kept optional so
# crates that never touch TOML (e.g. `changepacks-node`) do not pull
# `toml_edit` in through `changepacks-utils`.
toml = ["dep:toml_edit"]

[dependencies]
gix = { version = "0.86", default-features = false, features = ["index", "status", "parallel", "revision", "sha1"] }
anyhow.workspace = true
changepacks-core.workspace = true
tokio = { workspace = true, features = ["fs"] }
futures.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
ignore = "0.4"
glob = "0.3"
toml_edit = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
changepacks-node = { path = "../node" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[lints]
workspace = true

[[bench]]
name = "utils_bench"
harness = false
