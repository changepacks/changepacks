[package]
name = "changepacks-dart"
version = "0.2.21"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dart project support for changepacks (pub)"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
changepacks-utils.workspace = true
async-trait = "0.1"
yaml_serde = "0.10"
anyhow = "1.0"
tokio = { version = "1.52", features = ["fs"] }
yamlpatch = "1.26"
yamlpath = "1.26"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52", features = ["test-util", "macros"] }
rstest = "0.26"

[lints]
workspace = true
