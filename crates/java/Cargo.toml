[package]
name = "changepacks-java"
version = "0.2.25"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Java/Gradle project support for changepacks"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
changepacks-utils.workspace = true
async-trait = "0.1"
anyhow = "1.0"
tokio = { version = "1.53", features = ["fs", "process"] }
regex = "1"
serde_json = "1.0"
tempfile = "3.27"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util", "macros"] }
rstest = "0.26"

[lints]
workspace = true
