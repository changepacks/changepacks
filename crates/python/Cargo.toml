[package]
name = "changepacks-python"
version = "0.2.21"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python project support for changepacks (pip, uv)"
readme = "../../README.md"

[dependencies]
changepacks-core.workspace = true
# `toml` pulls in the shared `ensure_toml_table_like` manifest guard; this
# crate already depends on `toml_edit` directly, so the feature adds no new
# transitive dependency.
changepacks-utils = { workspace = true, features = ["toml"] }
anyhow.workspace = true
tokio = { workspace = true, features = ["fs"] }
async-trait.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
rstest.workspace = true
changepacks-utils = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
