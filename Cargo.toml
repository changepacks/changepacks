[workspace]
resolver = "3"
members = ["crates/*", "bridge/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/changepacks/changepacks"
homepage = "https://github.com/changepacks/changepacks"

[workspace.dependencies]
changepacks-cli = { path = "crates/cli", version = "^0.2.37" }
changepacks-core = { path = "crates/core", version = "^0.2.22" }
changepacks-node = { path = "crates/node", version = "^0.2.23" }
changepacks-rust = { path = "crates/rust", version = "^0.2.25" }
changepacks-python = { path = "crates/python", version = "^0.2.21" }
changepacks-dart = { path = "crates/dart", version = "^0.2.21" }
changepacks-csharp = { path = "crates/csharp", version = "^0.2.21" }
changepacks-java = { path = "crates/java", version = "^0.2.25" }
changepacks-utils = { path = "crates/utils", version = "^0.2.22" }

# Third-party dependencies shared by two or more workspace crates.
# Version requirements only: each crate keeps its own `features` list, which
# Cargo unions with the (empty) workspace feature set.
anyhow = "1.0"
async-trait = "0.1"
colored = "3.1"
futures = "0.3"
rstest = "0.26"
serde = "1.0"
serde_json = "1.0"
tempfile = "3.27"
tokio = "1.53"
toml_edit = "0.25"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
# Enforces the documented project constraint: no `unsafe` code in this workspace.
unsafe_code = "deny"

# Individually selected `clippy::pedantic` lints that the whole workspace
# satisfies, so `cargo clippy -- -D warnings` now enforces them.
#
# Listed one by one rather than as `pedantic = { level = "warn", priority = -1 }`
# because the group as a whole is NOT satisfied, and the only ways to enable it
# would be to bulk-`allow` the unsatisfied lints — the suppression this project
# forbids — or to fold unrelated refactors into a lint change. The group members
# deliberately left out are the ones that demand a design change rather than a
# mechanical edit: `too_many_lines` (would force splitting 11 functions),
# `needless_pass_by_value` / `implicit_hasher` (public signature changes),
# `fn_params_excessive_bools` (new parameter types), `similar_names` (renames),
# and `match_same_arms` (two sites keep split arms on purpose — see the comments
# in `cli/src/prompter.rs` and `java/src/gradle_dependency_lexer.rs`).
# Each belongs in its own reviewable change; add it here once its findings are
# resolved.
[workspace.lints.clippy]
borrow_as_ptr = "warn"
doc_markdown = "warn"
format_collect = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_wildcard_for_single_variants = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
