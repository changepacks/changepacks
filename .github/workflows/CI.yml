name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install maturin
        run: uv pip install maturin --system
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test

  coverage-test:
    name: Coverage Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs directly on the runner rather than in `xd009642/tarpaulin`. A
    # container job runs as root, and root holds CAP_DAC_OVERRIDE, which
    # bypasses the permission bits - so every test that proves an io failure by
    # clearing a file's write bit saw the write SUCCEED here while passing in
    # all twelve `Test` jobs, which run unprivileged. Installing the same
    # binary on the plain runner keeps this job's filesystem semantics
    # identical to those jobs and to a developer's machine. The container's
    # `seccomp=unconfined` went with it: that is a requirement of tarpaulin's
    # default ptrace engine, and this job runs `--engine llvm`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Build
        run: cargo check
      # A workspace build unifies features across members, so a crate whose own
      # manifest under-declares what its `src/` uses still compiles: some
      # sibling turned the feature on for everyone. `cargo publish` builds each
      # crate alone and is the only step that ever caught such a gap - after
      # lint, from a full rebuild of the packaged tarballs. Re-checking every
      # member against its own manifest reproduces the same failure in seconds,
      # and the `--all-features` pass additionally compiles the optional paths
      # (`test-support`, `toml`) that a default build never reaches.
      - name: Check each crate in isolation
        run: |
          for manifest in crates/*/Cargo.toml bridge/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo check --manifest-path "$manifest"
            cargo check --all-features --manifest-path "$manifest"
            echo "::endgroup::"
          done
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Deploy
        run: cargo publish --dry-run
      - name: Test
        run: |
          # rust coverage issue
          echo 'max_width = 100000' > .rustfmt.toml
          echo 'tab_spaces = 4' >> .rustfmt.toml
          echo 'newline_style = "Unix"' >> .rustfmt.toml
          echo 'fn_call_width = 100000' >> .rustfmt.toml
          echo 'fn_params_layout = "Compressed"' >> .rustfmt.toml
          echo 'chain_width = 100000' >> .rustfmt.toml
          echo 'merge_derives = true' >> .rustfmt.toml
          echo 'use_small_heuristics = "Default"' >> .rustfmt.toml
          cargo fmt
          cargo tarpaulin --out Lcov Stdout --engine llvm
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: lcov.info
        if: github.ref == 'refs/heads/main'
  # publish
  changepacks:
    name: changepacks
    runs-on: ubuntu-latest
    permissions:
      # create pull request comments
      pull-requests: write

      # Actions > General > Workflow permissions for creating pull request
      # Create brench to create pull request
      contents: write
    needs:
      - test
      - coverage-test
    steps:
      - uses: actions/checkout@v7
      - name: Make gradlew executable
        working-directory: ./examples/dart/flutter_app/android
        run: chmod +x gradlew
      - uses: changepacks/action@main
        id: changepacks
        with:
          publish: true
          publish_options: -l rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      changepacks: ${{ steps.changepacks.outputs.changepacks }}
      release_assets_urls: ${{ steps.changepacks.outputs.release_assets_urls }}
  # node
  node-build:
    needs:
      - test
      - coverage-test
      - changepacks
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/node/package.json') }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          - host: windows-latest
            build: bun run build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: bun run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    env:
      DEBUG: napi:*
      MACOSX_DEPLOYMENT_TARGET: '10.13'
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: bun install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
        working-directory: bridge/node
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            bridge/node/changepacks.*.node
          if-no-files-found: error
  
  # python
  python-build:
    runs-on: ${{ matrix.runner }}
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/python/pyproject.toml') }}
    needs:
      - test
      - coverage-test
      - changepacks
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux manylinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
            os: linux
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: auto
            os: linux

          # Linux musllinux
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: x86
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: musllinux_1_2
            os: musllinux
          - runner: ubuntu-22.04
            target: armv7
            manylinux: musllinux_1_2
            os: musllinux

          # Windows
          - runner: windows-latest
            target: x64
            os: windows
          - runner: windows-latest
            target: x86
            os: windows

          # macOS
          - runner: macos-14
            target: x86_64
            os: macos
          - runner: macos-14
            target: aarch64
            os: macos
    steps:
      - uses: actions/checkout@v7
      # Only the Linux legs build inside a maturin container that ships its own
      # rustc; macOS and Windows compile with whatever rustup the runner image
      # happens to carry. The macos-14 image trails stable by a release, so a
      # dependency that raises its MSRV to the newest stable breaks this job -
      # and only this job, because every other job installs stable explicitly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bridge/python
          manylinux: ${{ matrix.manylinux || '' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bridge/python/dist


  node-publish:
    name: Node Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - changepacks
      - node-build
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/node/package.json') }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
        working-directory: bridge/node
      - name: create npm dirs
        run: bunx napi create-npm-dirs
        working-directory: bridge/node
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: bridge/node/artifacts
      - name: Move artifacts
        run: bun run artifacts
        working-directory: bridge/node
      - name: List packages
        run: ls -R ./npm
        working-directory: bridge/node
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # npm (not bun) performs the publish: bun cannot do the npm OIDC token
      # exchange. Trusted Publishing (OIDC) requires npm >= 11.5.1 and a
      # trusted publisher registered for every package napi prepublish pushes.
      #
      # Pinned to the 11.x line instead of `latest`, which now resolves to 12:
      # `npm publish` runs prepublishOnly -> `napi prepublish`, which validates
      # every platform package by parsing `npm pack --dry-run --json` as a
      # top-level array. npm 12 changed that output to an object keyed by
      # package name (npm/cli#9247), so @napi-rs/cli 3.8.x aborts on the first
      # package with "Failed to validate the release package". 11.19.0 still
      # clears the >= 11.5.1 OIDC floor; drop the upper bound once napi-rs
      # accepts both shapes.
      - name: Ensure 11.5.1 <= npm < 12 (OIDC + @napi-rs/cli compatibility)
        run: npm install -g 'npm@^11'
      - name: Publish
        run: |
            bun install -g @napi-rs/cli
            npm publish --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: bridge/node
      - name: Upload Asset
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['bridge/node/package.json'] }}
          asset_path: bridge/node/npm/*/changepacks.*.node


  python-publish:
    name: Python Publish
    runs-on: ubuntu-latest
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'bridge/python/pyproject.toml') }}
    needs:
      - changepacks
      - python-build
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
      - name: List wheels
        run: ls -R .
      - name: Upload Asset
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['bridge/python/pyproject.toml'] }}
          asset_path: '*/*.whl'

  upload-assets:
    needs: changepacks
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'crates/changepacks/Cargo.toml') }}
    permissions:
      contents: write
      id-token: write
    name: Upload Assets for ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux
            target: x86_64-unknown-linux-gnu
            binary_name: changepacks-linux-x86_64
          - platform: windows-2022
            os: windows
            target: x86_64-pc-windows-msvc
            binary_name: changepacks-windows-x86_64.exe
          - platform: macos-14
            os: macos
            target: x86_64-apple-darwin
            binary_name: changepacks-darwin-x86_64
          - platform: macos-14
            os: macos
            target: aarch64-apple-darwin
            binary_name: changepacks-darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }} -p changepacks
      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/changepacks${{ matrix.os == 'windows' && '.exe' || '' }} ${{ matrix.binary_name }}
      
      - name: Upload Asset
        uses: owjs3901/upload-github-release-asset@main
        with:
          upload_url: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['crates/changepacks/Cargo.toml'] }}
          asset_path: ${{ matrix.binary_name }}

  winget-publish:
    name: Winget Publish
    runs-on: windows-2022
    if: ${{ contains(needs.changepacks.outputs.changepacks, 'crates/changepacks/Cargo.toml') }}
    needs:
      - changepacks
      # The installer published to winget is the release asset itself, so the
      # asset must already exist before komac is allowed to hash it.
      - upload-assets
    permissions:
      contents: read
    env:
      WINGET_IDENTIFIER: Changepacks.Changepacks
      # Pinned so a broken upstream komac release cannot silently break publishing.
      KOMAC_VERSION: 2.16.0
    steps:
      # Resolve the version and installer straight from the release that the
      # `changepacks` job just created. The release tag contains `/` and `()`
      # (e.g. `changepacks(crates/changepacks/Cargo.toml)@0.3.2`), so it cannot
      # be used as a URL path segment - the release id from the upload url is
      # the only reliable handle.
      - name: Resolve release version and installer
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ fromJson(needs.changepacks.outputs.release_assets_urls)['crates/changepacks/Cargo.toml'] }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UPLOAD_URL -notmatch '/releases/(\d+)/assets') {
            throw "Cannot parse release id from upload url: $env:UPLOAD_URL"
          }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($Matches[1])" `
            -Headers @{
              Authorization          = "Bearer $env:GH_TOKEN"
              Accept                 = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
          if ($release.tag_name -notmatch '@(\d+\.\d+\.\d+)$') {
            throw "Unexpected release tag, cannot derive a winget version: $($release.tag_name)"
          }
          $version = $Matches[1]
          $installers = @($release.assets | Where-Object { $_.name -like '*windows*.exe' })
          if ($installers.Count -ne 1) {
            throw "Expected exactly 1 windows .exe asset on '$($release.tag_name)', found $($installers.Count)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-url=$($installers[0].browser_download_url)" >> $env:GITHUB_OUTPUT
          Write-Host "winget: $env:WINGET_IDENTIFIER $version <- $($installers[0].browser_download_url)"

      # Downloaded directly instead of `cargo binstall komac`: binstall decides
      # "already installed" from ~/.cargo/.crates.toml, and Swatinem/rust-cache
      # (pulled in by setup-rust-toolchain) restores that metadata while dropping
      # komac.exe from ~/.cargo/bin - which made this job fail on every cache hit.
      - name: Install komac
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          Invoke-WebRequest `
            -Uri "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe" `
            -OutFile $komac
          & $komac --version
          if ($LASTEXITCODE -ne 0) { throw "komac download is not runnable" }

      - name: Publish to winget-pkgs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: changepacks
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_URL: ${{ steps.release.outputs.installer-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:RUNNER_TEMP 'komac.exe') update `
            $env:WINGET_IDENTIFIER --version $env:VERSION --urls $env:INSTALLER_URL --submit
          if ($LASTEXITCODE -ne 0) { throw "komac update failed with exit code $LASTEXITCODE" }

